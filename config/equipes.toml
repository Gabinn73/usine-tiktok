[jeux.un_contre_cent]
# LA BALLE gagne si elle arrive avant que les 100 soient TOUTES arrivées.
question = ["1 BALLE CONTRE 100", "LES 100 ARRIVERONT-ELLES TOUTES AVANT ELLE ?"]
min = 2
max = 2
sections = ["picots", "barres", "bumpers"]
longueur = 1.45     # ces sections sont plus rapides : parcours plus long pour rester à 65-90 s
equipes = [
  # rayon 34 : équilibré (~50 % de victoires mesurées sur 12 seeds)
  { nom = "LA BALLE", motif = "moitie", couleurs = ["#FFD54F", "#FF6F00"], balles = 1, rayon = 34 },
  { nom = "LES 100",  motif = "uni", couleurs = ["#4FC3F7"], balles = 100, rayon = 14, quota = 100 },
]
