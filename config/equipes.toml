# Jeux d'équipes. Chaque jeu définit la question d'accroche, le nombre d'équipes tirées
# au sort (min/max) et la liste des équipes possibles.
#
# Motifs de « drapeau » (formes simples dessinées en code, aucun logo) :
#   v      bandes verticales           h      bandes horizontales
#   croix  croix centrée (couleur 2 sur fond couleur 1)
#   nordique  croix décalée (couleur 2 sur fond 1, liseré optionnel couleur 3)
#   uni    une seule couleur            moitie  deux moitiés diagonales
# `poids` (optionnel) donne la largeur relative des bandes.
# `balles` (optionnel, défaut 1) : nombre de balles de l'équipe ; `rayon` (optionnel) ;
# `quota` (optionnel, défaut 1) : nombre de balles qui doivent franchir l'arrivée pour que
# l'équipe soit « arrivée ».
# `sections` (optionnel, par jeu) : sections de parcours autorisées. Une foule de balles
# s'embouteille sur les rampes/tapis/entonnoirs/portes : on les exclut pour ce mode.
# `longueur` (optionnel, par jeu, défaut 1) : multiplicateur de la longueur du parcours.

[jeux.pays]
question = ["QUEL PAYS ARRIVE", "EN BAS EN PREMIER ?"]
min = 3
max = 6
equipes = [
  { nom = "FRANCE",     motif = "v", couleurs = ["#0055A4", "#FFFFFF", "#EF4135"] },
  { nom = "ITALIE",     motif = "v", couleurs = ["#009246", "#FFFFFF", "#CE2B37"] },
  { nom = "ESPAGNE",    motif = "h", couleurs = ["#AA151B", "#F1BF00", "#AA151B"], poids = [1, 2, 1] },
  { nom = "ALLEMAGNE",  motif = "h", couleurs = ["#000000", "#DD0000", "#FFCE00"] },
  { nom = "BELGIQUE",   motif = "v", couleurs = ["#000000", "#FDDA24", "#EF3340"] },
  { nom = "PAYS-BAS",   motif = "h", couleurs = ["#AE1C28", "#FFFFFF", "#21468B"] },
  { nom = "PORTUGAL",   motif = "v", couleurs = ["#006600", "#FF0000"], poids = [2, 3] },
  { nom = "SUISSE",     motif = "croix", couleurs = ["#DA291C", "#FFFFFF"] },
  { nom = "SUÈDE",      motif = "nordique", couleurs = ["#006AA7", "#FECC00"] },
  { nom = "DANEMARK",   motif = "nordique", couleurs = ["#C8102E", "#FFFFFF"] },
  { nom = "NORVÈGE",    motif = "nordique", couleurs = ["#BA0C2F", "#FFFFFF", "#00205B"] },
  { nom = "POLOGNE",    motif = "h", couleurs = ["#FFFFFF", "#DC143C"] },
  { nom = "IRLANDE",    motif = "v", couleurs = ["#169B62", "#FFFFFF", "#FF883E"] },
  { nom = "AUTRICHE",   motif = "h", couleurs = ["#ED2939", "#FFFFFF", "#ED2939"] },
  { nom = "UKRAINE",    motif = "h", couleurs = ["#0057B7", "#FFD700"] },
  { nom = "HONGRIE",    motif = "h", couleurs = ["#CD2A3E", "#FFFFFF", "#436F4D"] },
]

